version: 2
updates:
  # requirements.txt and pyproject.toml declare the same runtime set; one grouped pull request a week
  # keeps the noise down while still surfacing "a pinned floor no longer installs".
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
